name: Bug Report
description: Report a defect in the PitchLab closed beta without sharing private data.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping us test PitchLab.

        **Privacy first:** This is a public GitHub issue. Never attach or paste an FM save, diagnostic logs, personal file paths, private player data, or unredacted screenshots. You can reply privately to your beta invitation email if the problem needs private details.
  - type: input
    id: version
    attributes:
      label: PitchLab version
      description: Shown in the app footer or Report a Bug panel.
      placeholder: "0.6.0b1"
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11 (64-bit)
        - Other / not sure
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area affected
      options:
        - Launch, browser, or Quit
        - Save import or validation
        - Scouting configuration
        - Results, shortlist, or player profile
        - Export
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use general or fictional examples. Do not paste information from a real save.
      placeholder: |
        1. Open PitchLab...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Do not include sensitive details.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: Only include non-sensitive details. If necessary, send logs or save information privately by replying to your beta invitation email.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included any FM save, logs, private player data, personal paths, or unredacted screenshots.
          required: true
